name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Compile extension bundle
        run: npm run compile

      - name: Compile tests
        run: npm run compile-tests

      - name: Unit tests
        run: npm run test:unit

      # VS Code needs a display; Linux runners have none, so provide a virtual one.
      - name: Integration tests (Extension Development Host)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx vscode-test

      - name: Integration tests (Extension Development Host)
        if: runner.os != 'Linux'
        run: npx vscode-test
