name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Compile extension bundle
        run: npm run compile

      - name: Compile tests
        run: npm run compile-tests

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (Extension Development Host)
        run: xvfb-run -a npx vscode-test
