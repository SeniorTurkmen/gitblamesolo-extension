name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish the version in package.json
        type: choice
        options: [both, marketplace, openvsx]
        default: both

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION."
            exit 1
          fi

      - name: Package
        id: package
        run: |
          VSIX="gitblamesolo-$(node -p "require('./package.json').version").vsix"
          npx vsce package --no-dependencies --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}

  marketplace:
    needs: package
    if: github.event_name == 'release' || inputs.target != 'openvsx'
    runs-on: ubuntu-latest
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ needs.package.outputs.vsix }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::The VSCE_PAT secret is not set, so the Visual Studio Marketplace was skipped."
            exit 1
          fi
          npx --yes @vscode/vsce@3 publish --packagePath "$VSIX"

  openvsx:
    needs: package
    if: github.event_name == 'release' || inputs.target != 'marketplace'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ needs.package.outputs.vsix }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx@1 publish "$VSIX"
          else
            npx --yes ovsx@1 publish "$VSIX" --trusted-publishing
          fi

  release-asset:
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VSIX: ${{ needs.package.outputs.vsix }}
        run: gh release upload "$TAG" "$VSIX" --clobber --repo "${{ github.repository }}"
