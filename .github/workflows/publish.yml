name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish the version in package.json
        type: choice
        options: [both, marketplace, openvsx, marketplace-identity]
        default: both

permissions:
  contents: read

jobs:
  package:
    if: github.event_name == 'release' || inputs.target != 'marketplace-identity'
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION."
            exit 1
          fi

      - name: Package
        id: package
        run: |
          VSIX="gitblamesolo-$(node -p "require('./package.json').version").vsix"
          npx vsce package --no-dependencies --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix }}

  # Signs in to Microsoft Entra ID as a user-assigned managed identity through
  # GitHub's OIDC token, so no Marketplace token is stored anywhere.
  marketplace:
    needs: package
    if: github.event_name == 'release' || inputs.target == 'both' || inputs.target == 'marketplace'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to the Visual Studio Marketplace
        env:
          VSIX: ${{ needs.package.outputs.vsix }}
        run: npx --yes @vscode/vsce@4 publish --azure-credential --packagePath "$VSIX"

  # One-time setup: prints the ID to add as a member of the Marketplace publisher.
  marketplace-identity:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'marketplace-identity'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      id-token: write
    steps:
      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Print the identity's Marketplace member ID
        run: |
          ID=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          echo "Add this ID as a Contributor member of the Marketplace publisher: $ID"
          echo "### Marketplace member ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Add \`$ID\` as a **Contributor** member of the publisher." >> "$GITHUB_STEP_SUMMARY"

  openvsx:
    needs: package
    if: github.event_name == 'release' || inputs.target == 'both' || inputs.target == 'openvsx'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ needs.package.outputs.vsix }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx@1 publish "$VSIX"
          else
            npx --yes ovsx@1 publish "$VSIX" --trusted-publishing
          fi

  release-asset:
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VSIX: ${{ needs.package.outputs.vsix }}
        run: gh release upload "$TAG" "$VSIX" --clobber --repo "${{ github.repository }}"
